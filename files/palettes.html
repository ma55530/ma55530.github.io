<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette options — Matija Akrap</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1efec;color:#34312e;font:16px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:24px}h1{font:32px Georgia,serif;margin:0 0 8px}p{margin:0 0 20px;color:#625d57}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}button{font:inherit;text-align:left;padding:16px;border:1px solid #ccc;border-radius:8px;cursor:pointer;background:var(--bg);color:var(--ink)}button[aria-pressed=true]{outline:2px solid #504b45;outline-offset:2px}button strong,button small{display:block}button small{margin:7px 0 12px;line-height:1.4}.swatches{display:flex;gap:7px}.swatches i{display:block;width:25px;height:25px;background:var(--c);border:1px solid #0002;border-radius:50%}.toolbar{display:flex;align-items:center;gap:15px;margin-bottom:12px;flex-wrap:wrap}select,a{font:inherit;color:inherit}select{padding:6px}iframe{width:100%;height:800px;border:1px solid #d2ccc4;border-radius:5px;background:#fff}.label{margin-left:auto;font-size:14px}a{padding:8px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #2c5e90;outline-offset:3px}@media(max-width:700px){main{padding:16px}.choices{grid-template-columns:1fr 1fr}iframe{height:700px}}
</style></head><body><main>
<h1>Four quieter palettes</h1><p>Preview each on the actual site. These controls only change the preview; your final palette is still undecided.</p>
<div class="choices" role="group" aria-label="Palette options">
<button data-palette="paper" aria-pressed="true" style="--bg:#f8f5ef;--ink:#332e29"><strong>1 · Warm paper</strong><small>Ivory, sand, walnut.<br>Closest to beige simplicity.</small><span class="swatches"><i style="--c:#f8f5ef"></i><i style="--c:#eee5d7"></i><i style="--c:#855b3e"></i><i style="--c:#332e29"></i></span></button>
<button data-palette="coast" aria-pressed="false" style="--bg:#f7f5f0;--ink:#30363a"><strong>2 · Coastal linen</strong><small>Off-white, mist, slate blue.<br>Echoes the Étretat painting.</small><span class="swatches"><i style="--c:#f7f5f0"></i><i style="--c:#e7edf0"></i><i style="--c:#3e657b"></i><i style="--c:#30363a"></i></span></button>
<button data-palette="clay" aria-pressed="false" style="--bg:#faf4ee;--ink:#3b302d"><strong>3 · Soft terracotta</strong><small>Cream, blush, burnt clay.<br>Warmer and more personal.</small><span class="swatches"><i style="--c:#faf4ee"></i><i style="--c:#f0dfd5"></i><i style="--c:#98513c"></i><i style="--c:#3b302d"></i></span></button>
<button data-palette="plum" aria-pressed="false" style="--bg:#f7f4f2;--ink:#383039"><strong>4 · Plum & parchment</strong><small>Pearl, mauve, muted plum.<br>Quiet with a distinct accent.</small><span class="swatches"><i style="--c:#f7f4f2"></i><i style="--c:#eae2e7"></i><i style="--c:#785270"></i><i style="--c:#383039"></i></span></button>
</div>
<div class="toolbar"><label for="page">Preview page</label><select id="page"><option value="index.html">Homepage</option><option value="cv.html">CV</option><option value="posts/2026-11-07-hello/index.html">Blog post</option><option value="publications.html">Publications</option></select><a id="open" href="../index.html?palette=paper" target="_blank">Open full size ↗</a><span class="label" id="label">Warm paper</span></div>
<iframe id="preview" title="Selected palette on Matija's site" src="../index.html?palette=paper"></iframe>
</main><script>
const buttons=[...document.querySelectorAll('[data-palette]')];let palette='paper';const page=document.getElementById('page');
function update(){const url='../'+page.value+'?palette='+palette;document.getElementById('preview').src=url;document.getElementById('open').href=url;}
buttons.forEach(b=>b.addEventListener('click',()=>{palette=b.dataset.palette;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('label').textContent=b.querySelector('strong').textContent;update();}));page.addEventListener('change',update);
</script></body></html>

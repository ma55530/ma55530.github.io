<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Étretat composition</title><style>body{font:16px system-ui;color:#302f29;background:#f7f3eb;margin:0;padding:22px}h1{font:30px Georgia;margin:0 0 8px}p{line-height:1.5}.controls{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:7px;min-width:190px;flex:1}input{width:100%;accent-color:#3f7d4a}iframe{width:100%;height:75vh;border:1px solid #d7d0c2;background:#f7f3eb}a{color:#3f7d4a}</style></head><body><h1>Adjust Étretat</h1><p>Move the painting toward the centre and adjust its fade. Height applies on wide screens. These settings are a preview; send me the values you like to make them the default.</p><div class="controls"><label>Move inward: <output id="inset-out">160 px</output><input type="range" id="inset" min="0" max="400" value="160"></label><label>Fade width: <output id="fade-out">68%</output><input type="range" id="fade" min="20" max="95" value="68"></label><label>Height: <output id="height-out">900 px</output><input type="range" id="height" min="500" max="1400" value="900"></label></div><p><a id="full" target="_blank" href="../?inset=160&amp;fade=68&amp;height=900">Open preview full size ↗</a></p><iframe id="preview" title="Website artwork preview" src="../?inset=160&amp;fade=68&amp;height=900"></iframe><script>const ids=['inset','fade','height'];let timer;function update(){const p=new URLSearchParams();ids.forEach(id=>{const v=document.getElementById(id).value;p.set(id,v);document.getElementById(id+'-out').textContent=v+(id==='fade'?'%':' px')});const url='../?'+p;document.getElementById('preview').src=url;document.getElementById('full').href=url}ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(update,150)}));</script></body></html>

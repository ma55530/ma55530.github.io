<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adjust grain</title><style>body{font:16px system-ui;color:#302f29;background:#f7f3eb;margin:0;padding:22px}h1{font:30px Georgia;margin:0 0 8px}p{line-height:1.5}.controls{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:7px;min-width:190px;flex:1}input{width:100%;accent-color:#3f7d4a}iframe{width:100%;height:75vh;border:1px solid #d7d0c2;background:#f7f3eb}a{color:#3f7d4a}select{padding:5px;font:inherit}</style></head><body><h1>Adjust the grain</h1><p>The grain is spread evenly over the background. Adjust its strength on the real site. They are temporary previews; share the values you like to make them the default.</p><div class="controls"><label>Strength: <output id="grain-out">22%</output><input type="range" id="grain" min="0" max="100" value="22"></label><label>Contrast: <output id="contrast-out">170%</output><input type="range" id="contrast" min="100" max="300" value="170"></label><label>Brightness: <output id="brightness-out">100%</output><input type="range" id="brightness" min="80" max="300" step="5" value="100"></label></div><p><label for="page">Page:</label> <select id="page"><option value="index.html">Home</option><option value="cv.html">CV</option><option value="publications.html">Publications</option></select> <a id="full" target="_blank" href="../index.html?grain=0.22&amp;contrast=170&amp;brightness=100">Open full size ↗</a></p><iframe id="preview" title="Grain preview" src="../index.html?grain=0.22&amp;contrast=170&amp;brightness=100"></iframe><script>const ids=['grain','contrast','brightness'];let timer;function update(){const p=new URLSearchParams();ids.forEach(id=>{const v=document.getElementById(id).value;p.set(id,id==='grain'?v/100:v);document.getElementById(id+'-out').textContent=v+'%'});const url='../'+document.getElementById('page').value+'?'+p;document.getElementById('preview').src=url;document.getElementById('full').href=url}ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(update,200)}));document.getElementById('page').addEventListener('change',update);</script></body></html>

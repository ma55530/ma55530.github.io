# Settings for every post in /posts
title-block-banner: false
date-format: "MMMM D, YYYY"
reference-location: margin
citation-location: document   # reference list at the bottom
reference-section-title: References   # stops a final heading from becoming the References title
toc: false
body-classes: blog-article
template-partials:
  - ../files/partials/title-metadata.html   # adds the optional read-time field

